<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7efe2">
  <title>Mazel Tov | Bentzy & Esti</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="celebration" aria-labelledby="celebration-title">
    <div class="corner-mark corner-mark--top" aria-hidden="true">✦</div>
    <div class="corner-mark corner-mark--bottom" aria-hidden="true">✦</div>

    <section class="invite">
      <p class="eyebrow"><span></span> with great joy <span></span></p>
      <div class="ornament" aria-hidden="true">✦</div>
      <h1 id="celebration-title">Mazel Tov</h1>
      <p class="names">BENTZY AND ESTI!</p>
      <div class="rule" aria-hidden="true"><span></span><b>✦</b><span></span></div>
      <p class="message">A beautiful beginning, a lifetime of joy.</p>
      <button class="celebrate-button" type="button" aria-label="Celebrate with confetti">Celebrate <span aria-hidden="true">↗</span></button>
    </section>

    <p class="footer-note">May your home be filled with light, laughter, and love</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
